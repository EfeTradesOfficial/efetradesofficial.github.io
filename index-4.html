<style>
/* Layout: tek sütun mobil günlük — özet şeridi + R eğrisi, filtre çipleri, işlem kartları; detay ve form tam ekran sayfa olarak açılır */
:root{
  /* Varsayılan: siyah-yeşil. Renkler tema panelinden değiştirilir (applyTheme) */
  --bg:#08090A; --surface:#111413; --ink:#E4ECE7; --muted:#86928B; --line:#222926;
  --accent:#22C55E; --on-accent:#04140A; --win:#22C55E; --loss:#F05252; --be:#86928B;
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --win-soft:color-mix(in srgb,var(--win) 16%,var(--surface));
  --loss-soft:color-mix(in srgb,var(--loss) 16%,var(--surface));
  --be-soft:color-mix(in srgb,var(--muted) 14%,var(--surface));
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header.top h1{font-size:26px;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.notice{font-size:13px;color:var(--muted);background:var(--be-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px}

/* özet */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;margin-top:2px}
@media (max-width:440px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.curve{width:100%;height:84px;display:block}
.curve-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.setups{display:flex;flex-wrap:wrap;gap:6px}
.setups .st{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:var(--f-mono)}

/* filtreler */
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* liste */
.daygroup{margin-top:18px}
.dayhead{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px}
.list{display:grid;gap:8px}
.trade{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;cursor:pointer;color:var(--ink);font:inherit;overflow:hidden}
.trade:hover{border-color:var(--muted)}
.trade .stripe{align-self:stretch;margin:-12px 0}
.trade .stripe.win{background:var(--win)} .trade .stripe.loss{background:var(--loss)} .trade .stripe.be{background:var(--be)} .trade .stripe.open{background:var(--accent)}
.trade .main{min-width:0}
.trade .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sym{font-family:var(--f-mono);font-weight:600;font-size:15px}
.dir{font-size:11px;font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.dir.long{background:var(--win-soft);color:var(--win)} .dir.short{background:var(--loss-soft);color:var(--loss)}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;text-align:right}
.rv.win{color:var(--win)} .rv.loss{color:var(--loss)} .rv.be{color:var(--be)} .rv.open{color:var(--accent)}
.rv small{display:block;font-size:11px;font-weight:400;color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;margin-top:16px}
.empty h3{font-size:18px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 14px;max-width:40ch}

/* butonlar */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;font:600 14px var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.ghost{background:transparent;border-color:transparent}
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px 20px;border-radius:14px;font-size:15px}

/* sayfa (detay/form) */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.sheet h2{font-size:24px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bigR{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:440px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;margin-top:2px;overflow-wrap:anywhere}
.section{margin-top:18px;display:grid;gap:10px}
.section > h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 9px;font-weight:600}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shots a{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.shots img{display:block;width:100%;height:auto}
.link{color:var(--accent);overflow-wrap:anywhere}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--loss-soft);color:var(--loss);border-radius:12px;padding:12px}

/* form */
form{display:grid;gap:14px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0;margin-bottom:8px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0}
input.mono{font-family:var(--f-mono)}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pickset{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--loss);font-size:13px}
.formbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<style>
.ownerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--accent-soft);color:var(--accent)}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.setup ol{padding-left:20px;display:grid;gap:8px;max-width:65ch}
.setup code{font-family:var(--f-mono);font-size:13px;background:var(--be-soft);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.loading{color:var(--muted);text-align:center;padding:30px 0}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.musicbox{display:flex;align-items:center;gap:6px}
.musicbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px var(--f-body);cursor:pointer}
.musicbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.musicbtn .bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.musicbtn .bars i{display:block;width:3px;height:4px;background:currentColor;border-radius:1px}
.musicbtn[aria-pressed="true"] .bars i{animation:eq 1s ease-in-out infinite}
.musicbtn .bars i:nth-child(2){animation-delay:.2s}.musicbtn .bars i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.vol{width:84px;accent-color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:9px 12px;font:600 14px var(--f-body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.calhead h2{font-size:20px;min-width:140px;text-align:center}
.calnav{display:flex;align-items:center;gap:6px}
.calnav .btn{padding:8px 12px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);color:var(--muted);padding:7px 11px;font:600 12.5px var(--f-body);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.calwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,.9fr);gap:4px}
.cal .dow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 4px}
.cell{min-height:74px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:6px;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--ink);font:inherit;min-width:0}
.cell.out{opacity:.35}
.cell.has{cursor:pointer}
.cell.has:hover{border-color:var(--muted)}
.cell.win{background:var(--win-soft);border-color:color-mix(in srgb,var(--win) 45%,var(--line))}
.cell.loss{background:var(--loss-soft);border-color:color-mix(in srgb,var(--loss) 45%,var(--line))}
.cell.today .d{color:var(--accent);font-weight:700}
.cell .d{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.cell .r{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .n{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.win .r{color:var(--win)} .cell.loss .r{color:var(--loss)}
.cell.wk{background:transparent;border-style:dashed}
@media (max-width:600px){.cal{grid-template-columns:repeat(7,minmax(0,1fr))}.cal .wkcol{display:none}.cell{min-height:56px;padding:4px}.cell .r{font-size:11.5px}.cell .n{display:none}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0}
.stat .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.statsbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.statsbar h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:600}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:14px;cursor:pointer}
.radios input{width:auto;accent-color:var(--accent)}
@media (prefers-reduced-motion: reduce){.musicbtn .bars i{animation:none!important}}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.preset{display:grid;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px;cursor:pointer;font:600 13px var(--f-body)}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset .sw{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.preset .sw span{flex:1}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.colors label{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font-size:14px}
.colors input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;flex:none;cursor:pointer}
.colors .hex{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:400px){.colors{grid-template-columns:1fr}}
.trade.has-thumb{grid-template-columns:6px 64px 1fr auto}
.thumb{width:64px;height:44px;border-radius:7px;object-fit:cover;border:1px solid var(--line);background:var(--be-soft)}
@media (max-width:400px){.trade.has-thumb{grid-template-columns:6px 1fr auto}.trade.has-thumb .thumb{display:none}}
.hero{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--be-soft);cursor:zoom-in;margin-bottom:14px}
.hero img{display:block;width:100%;height:auto}
.shotcap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 2px 0}
.shots button.sh{display:block;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--be-soft);cursor:zoom-in;width:100%}
.shots button.sh img{display:block;width:100%;height:auto}
.capture-row{display:flex;gap:8px;flex-wrap:wrap}
.capture-row .btn{flex:1;min-width:150px}
.dropzone{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13px}
.dropzone.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.shot-item{display:grid;gap:6px;min-width:0}
.shot-item .pic{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--be-soft)}
.shot-item .pic img{display:block;width:100%;height:auto}
.shot-item .pic .state{position:absolute;inset:auto 6px 6px 6px;font-size:12px;background:var(--surface);color:var(--ink);border-radius:7px;padding:3px 8px;text-align:center}
.shot-item .pic .state.bad{color:var(--loss)}
.shot-item .tools{display:flex;gap:6px}
.shot-item select{padding:6px 8px;font-size:13px}
.shot-item .tools button{padding:6px 10px;font-size:12px;flex:none}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(8,10,18,.94);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#E7E9F1;font-size:13px}
.viewer .vbar button,.viewer .vbar a{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:9px;padding:8px 12px;font:600 13px var(--f-body);cursor:pointer;text-decoration:none}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding-top:10px}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1 id="title">Trade Günlüğü</h1>
      <span class="sub" id="countSub">Yükleniyor…</span>
    </div>
    <div class="hdr-actions">
      <div class="musicbox" id="musicBox" hidden><button type="button" class="musicbtn" id="musicBtn" aria-pressed="false" title="Arka plan müziği"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="musicLbl">Müzik</span></button><input class="vol" id="musicVol" type="range" min="0" max="100" value="45" aria-label="Ses düzeyi" hidden></div>
      <div class="ownerbar" id="ownerBar" hidden><span class="pill">Düzenleme modu</span><button class="btn" type="button" id="quickCap" hidden>Grafiği yakala</button><button class="btn ghost" type="button" id="logout">Çıkış</button></div>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>

  <div id="setupArea" hidden></div>

  <div id="journal">
    <div class="tabs" role="tablist" aria-label="Görünüm">
      <button type="button" class="tab" role="tab" id="tabBtnTrades" aria-selected="true" aria-controls="tabTrades">İşlemler</button>
      <button type="button" class="tab" role="tab" id="tabBtnCal" aria-selected="false" aria-controls="tabCal">Geçmiş</button>
    </div>
    <div id="tabTrades" role="tabpanel">

        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" type="button" id="calToday">Bu ay</button><span class="seg2" id="unitSeg" hidden><button type="button" data-u="R" aria-pressed="true">R</button><button type="button" data-u="$" aria-pressed="false">K/Z</button></span></div>

<script>
/* ================= AYARLAR =================
   Kurulumda yalnızca bu iki satırı düzenle. */
const API_URL = "https://script.google.com/macros/s/AKfycbx8Q5Tcw6NlsDUqiweptBfkDNmfDo2JRRBbPLMIyONpNIJaT11r6cWrOpnwsRv2ycux/exec";          // Apps Script web uygulaması adresi (…/exec ile biter)
const SAHIP_ADI = "";        // ör. "Efe Boylu" — başlıkta görünür, boş bırakılabilir
/* =========================================== */

(function(){
const SETUPS=["MSS","BOS","FVG","Order Block","Breaker","Likidite alımı","OTE","Judas swing","SMT"];
const SESSIONS=["Asya","Londra","New York AM","New York PM","Diğer"];
const EMOTIONS=["Sakin","Odaklı","Aceleci","FOMO","İntikam","Tereddütlü","Yorgun"];
const TFS=["1dk","3dk","5dk","15dk","1s","4s","1G"];
const SHOT_LABELS=["Giriş","Çıkış","HTF","Yönetim","Diğer"];
const canCapture=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)&&!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
let activePaste=null;

/* ---------- tema ---------- */
const THEME_LS="tg-tema";
const THEME_KEYS=[["bg","Arka plan"],["surface","Kartlar"],["ink","Yazı"],["muted","İkincil yazı"],["line","Çizgiler"],["accent","Vurgu"],["win","Kazanç"],["loss","Kayıp"]];
const PRESETS=[
  {n:"Siyah · Yeşil",t:{bg:"#08090A",surface:"#111413",ink:"#E4ECE7",muted:"#86928B",line:"#222926",accent:"#22C55E",win:"#22C55E",loss:"#F05252"}},
  {n:"Terminal",t:{bg:"#000000",surface:"#0A0F0B",ink:"#C8F5D4",muted:"#5F8A6B",line:"#15301E",accent:"#00E676",win:"#00E676",loss:"#FF4D4D"}},
  {n:"Orman",t:{bg:"#0A120E",surface:"#122019",ink:"#E2EEE6",muted:"#83998C",line:"#21352B",accent:"#4ADE80",win:"#4ADE80",loss:"#F87171"}},
  {n:"Grafit · Lime",t:{bg:"#111312",surface:"#1A1D1B",ink:"#ECEFEC",muted:"#8F9690",line:"#2B302D",accent:"#A3E635",win:"#84CC16",loss:"#EF4444"}},
  {n:"Gece mavisi",t:{bg:"#0E1220",surface:"#171C2D",ink:"#E7E9F1",muted:"#9097AC",line:"#2A3046",accent:"#E3A84A",win:"#4CC28F",loss:"#EE7A7A"}},
  {n:"Açık · Yeşil",t:{bg:"#F3F6F4",surface:"#FFFFFF",ink:"#0F1712",muted:"#5C6B63",line:"#DCE3DF",accent:"#15803D",win:"#15803D",loss:"#C0392B"}}
];
const DEFAULT_THEME=PRESETS[0].t;
let savedTheme={...DEFAULT_THEME};
function lum(hex){const n=parseInt(hex.slice(1),16);const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function validTheme(t){const o={...DEFAULT_THEME};if(t)for(const [k] of THEME_KEYS)if(/^#[0-9a-fA-F]{6}$/.test(t[k]||""))o[k]=t[k];return o}
function applyTheme(t){
  t=validTheme(t);const r=document.documentElement.style;
  for(const [k] of THEME_KEYS)r.setProperty("--"+k,t[k]);
  r.setProperty("--be",t.muted);
  r.setProperty("--on-accent",lum(t.accent)>.35?"#06110A":"#FFFFFF");
  r.setProperty("color-scheme",lum(t.bg)<.2?"dark":"light");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t.bg);
  return t;
}
try{const c=JSON.parse(localStorage.getItem(THEME_LS)||"null");if(c)savedTheme=validTheme(c)}catch(e){}
applyTheme(savedTheme);
function setSavedTheme(t){savedTheme=validTheme(t);applyTheme(savedTheme);try{localStorage.setItem(THEME_LS,JSON.stringify(savedTheme))}catch(e){}}
const KEY_LS="tg-sahip-sifre", CACHE_LS="tg-onbellek";

let trades=[]; let ownerKey=null;
let filter={kind:"all",value:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

function calcR(t){
  const e=num(t.entry),s=num(t.stop),x=num(t.exit);
  if(e!=null&&s!=null&&x!=null&&e!==s){const risk=Math.abs(e-s);const r=t.dir==="short"?(e-x)/risk:(x-e)/risk;return Math.round(r*100)/100}
  return null;
}
function rOf(t){const m=num(t.rManual);if(m!=null)return m;return calcR(t)}
function outcome(t){const r=rOf(t);if(r==null)return "open";if(r>0.05)return "win";if(r<-0.05)return "loss";return "be"}
const fmtR=r=>r==null?"—":(r>0?"+":"")+r.toFixed(2)+"R";
const fmtDate=d=>{try{const x=new Date(String(d).length<=10?d+"T12:00":d);return x.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric",weekday:"short"})}catch(e){return d}};
const fmtTime=d=>{try{return new Date(d).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
const OUT_LABEL={win:"Kazanç",loss:"Kayıp",be:"Başa baş",open:"Açık / sonuç yok"};

/* ---------- API ---------- */
async function apiGet(){
  const r=await fetch(API_URL+"?action=list",{method:"GET"});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"Okunamadı"); return j;
}
async function apiPost(body){
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({...body,key:ownerKey})});
  const j=await r.json();
  if(!j.ok){const e=new Error(j.error||"Hata");e.auth=j.error==="auth";throw e}
  return j;
}
async function load(){
  try{
    const j=ownerKey?await apiPost({action:"list"}):await apiGet();
    trades=j.trades||[]; if(!ownerKey) lsSet(CACHE_LS,JSON.stringify(trades));
    if(j.theme&&$("sheet").hidden)setSavedTheme(j.theme);
    Music.configure(j.settings&&j.settings.music);
    $("notice").hidden=true; render();
  }catch(e){
    if(e.auth){logout();showNotice("Şifre artık geçerli değil. Tekrar giriş yap.");return}
    showNotice("İşlemlere şu an ulaşılamıyor. İnternet bağlantını kontrol edip sayfayı yenile.");
    render();
  }
}
async function saveTrade(t){await apiPost({action:"save",trade:t});const i=trades.findIndex(x=>x.id===t.id);if(i>=0)trades[i]=t;else trades.push(t);render()}
async function deleteTrade(id){await apiPost({action:"delete",id});trades=trades.filter(x=>x.id!==id);render()}
function newId(){return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function showNotice(t){const n=$("notice");n.textContent=t;n.hidden=false}

/* ---------- sahip modu ---------- */
function setOwner(k){ownerKey=k;lsSet(KEY_LS,k);$("ownerBar").hidden=!k;$("addBtn").hidden=!k;$("loginLink").hidden=!!k;$("quickCap").hidden=!(k&&canCapture);$("themeLink").hidden=!k;$("musicLink").hidden=!k;if(typeof renderCal==="function"&&$("cal"))renderCal()}

function openTheme(){
  let draft={...savedTheme};
  const same=(a,b)=>THEME_KEYS.every(([k])=>a[k].toLowerCase()===b[k].toLowerCase());
  openSheet(`<div class="sheet-bar"><button class="btn ghost" type="button" id="back">← Vazgeç</button><span></span></div>
    <h2>Tema</h2><p class="hint" style="margin:6px 0 16px">Değişiklikleri anında görürsün. Kaydettiğinde ziyaretçiler de bu temayı görür.</p>
    <div class="section" style="margin-top:0"><h3>Hazır temalar</h3><div class="presets" id="presets"></div></div>
    <div class="section"><h3>Renkler</h3><div class="colors" id="colors"></div></div>
    <p class="err" id="thErr" hidden></p>
    <div class="formbar" style="margin-top:18px"><button class="btn" type="button" id="thReset">Varsayılana dön</button><button class="btn primary" type="button" id="thSave">Herkes için kaydet</button></div>`);
  const draw=()=>{
    applyTheme(draft);
    $("presets").innerHTML=PRESETS.map((p,i)=>`<button type="button" class="preset" data-p="${i}" aria-pressed="${same(p.t,draft)}"><span class="sw">${["bg","surface","accent","win","loss"].map(k=>`<span style="background:${p.t[k]}"></span>`).join("")}</span>${esc(p.n)}</button>`).join("");
    $("presets").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{draft={...PRESETS[+b.dataset.p].t};draw()});
    $("colors").innerHTML=THEME_KEYS.map(([k,l])=>`<label><input type="color" id="c_${k}" value="${draft[k]}">${l}<span class="hex" id="h_${k}">${draft[k].toUpperCase()}</span></label>`).join("");
    THEME_KEYS.forEach(([k])=>$("c_"+k).addEventListener("input",e=>{draft[k]=e.target.value;$("h_"+k).textContent=e.target.value.toUpperCase();applyTheme(draft);
      $("presets").querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",same(PRESETS[+b.dataset.p].t,draft)))}));
  };
  draw();
  const cancel=()=>{applyTheme(savedTheme);closeSheet()};
  $("back").onclick=cancel;
  $("thReset").onclick=()=>{draft={...DEFAULT_THEME};draw()};
  $("thSave").onclick=async()=>{const b=$("thSave");b.disabled=true;b.textContent="Kaydediliyor…";
    try{await apiPost({action:"theme",theme:draft});setSavedTheme(draft);closeSheet()}
    catch(e){b.disabled=false;b.textContent="Herkes için kaydet";$("thErr").textContent=e.auth?"Şifre geçersiz. Tekrar giriş yap.":"Kaydedilemedi. Bağlantını kontrol edip tekrar dene.";$("thErr").hidden=false}};
}

/* ---------- ekran yakalama ---------- */
function canvasToJpeg(src,w,h){const max=2000;const k=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.88)}
async function captureScreen(){
  const stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:"window",cursor:"never"},audio:false,selfBrowserSurface:"exclude",surfaceSwitching:"exclude"});
  try{
    const v=document.createElement("video");v.muted=true;v.playsInline=true;v.srcObject=stream;await v.play();
    await new Promise(r=>setTimeout(r,350));
    if(!v.videoWidth)throw new Error("Görüntü alınamadı");
    return canvasToJpeg(v,v.videoWidth,v.videoHeight);
  }finally{stream.getTracks().forEach(t=>t.stop())}
}
function captureError(e){return e&&e.name==="NotAllowedError"?null:"Ekran yakalanamadı. Tarayıcı izinlerini kontrol et ya da görüntüyü yapıştırarak ekle."}

/* ---------- görüntü görüntüleyici ---------- */
let vList=[],vIdx=0;
function openViewer(list,i){vList=list;vIdx=i;$("viewer").hidden=false;showV()}
function showV(){const s=vList[vIdx];$("vImg").src=s.url;$("vImg").alt=s.label||"Grafik görüntüsü";$("vCap").textContent=(s.label||"Görüntü")+` · ${vIdx+1}/${vList.length}`;
  $("vOpen").href=s.id?`https://drive.google.com/file/d/${s.id}/view`:s.url;$("vPrev").hidden=$("vNext").hidden=vList.length<2}
$("vClose").onclick=()=>{$("viewer").hidden=true};
$("vPrev").onclick=()=>{vIdx=(vIdx-1+vList.length)%vList.length;showV()};
$("vNext").onclick=()=>{vIdx=(vIdx+1)%vList.length;showV()};
document.addEventListener("keydown",e=>{if($("viewer").hidden)return;if(e.key==="Escape"){e.stopImmediatePropagation();$("viewer").hidden=true}if(e.key==="ArrowRight")$("vNext").click();if(e.key==="ArrowLeft")$("vPrev").click()},true);
function logout(){setOwner(null);lsSet(KEY_LS,null);load()}
function openLogin(){
  openSheet(`<div class="sheet-bar"><button class="btn ghost" type="button" id="back">← Geri</button><span></span></div>
    <h2>Sahip girişi</h2><p class="hint" style="margin:6px 0 16px">İşlem eklemek ve düzenlemek için Apps Script'e yazdığın şifreyi gir. Bu cihazda hatırlanır.</p>
    <form id="lf"><label>Şifre<input id="f_key" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lErr" hidden></p><div class="formbar"><button class="btn primary" type="submit" id="lBtn">Giriş yap</button></div></form>`);
  $("back").onclick=closeSheet;
  setTimeout(()=>$("f_key").focus(),50);
  $("lf").onsubmit=async ev=>{ev.preventDefault();const k=$("f_key").value;const b=$("lBtn");b.disabled=true;b.textContent="Kontrol ediliyor…";
    const prev=ownerKey;ownerKey=k;
    try{await apiPost({action:"ping"});setOwner(k);closeSheet();load()}
    catch(e){ownerKey=prev;b.disabled=false;b.textContent="Giriş yap";$("lErr").textContent=e.auth?"Şifre yanlış.":"Sunucuya ulaşılamadı. Bağlantını kontrol et.";$("lErr").hidden=false}};
}

/* ---------- liste ---------- */
function filtered(){
  return trades.filter(t=>{
    if(filter.kind==="all")return true;
    if(filter.kind==="out")return outcome(t)===filter.value;
    if(filter.kind==="sym")return (t.symbol||"").toUpperCase()===filter.value;
    if(filter.kind==="setup")return (t.setups||[]).includes(filter.value);
    if(filter.kind==="rules")return t.rulesFollowed===false;
    return true;
  }).sort((a,b)=>String(b.datetime).localeCompare(String(a.datetime)));
}
function render(){
  const list=filtered();
  const last=trades.map(t=>t.datetime).sort().pop();
  $("countSub").textContent=trades.length?`${trades.length} işlem${last?" · son işlem "+fmtDate(last.slice(0,10)):""}`:"Henüz işlem yok";
  renderSummary(list);renderFilters();renderList(list);renderCal();
}
function renderSummary(list){
  const closed=list.filter(t=>rOf(t)!=null);
  const wins=closed.filter(t=>outcome(t)==="win").length, losses=closed.filter(t=>outcome(t)==="loss").length;
  const tot=closed.reduce((s,t)=>s+rOf(t),0);
  $("kTotal").textContent=list.length;
  $("kWin").textContent=(wins+losses)?Math.round(wins/(wins+losses)*100)+"%":"–";
  const kR=$("kR");kR.textContent=(tot>0?"+":"")+tot.toFixed(2);kR.style.color=tot>0?"var(--win)":tot<0?"var(--loss)":"var(--ink)";
  $("kAvg").textContent=closed.length?((tot/closed.length>0?"+":"")+(tot/closed.length).toFixed(2)):"–";
  const asc=closed.slice().sort((a,b)=>String(a.datetime).localeCompare(String(b.datetime)));
  let acc=0;const pts=[0].concat(asc.map(t=>acc+=rOf(t)));
  const svg=$("curve");const W=600,H=84,P=6;
  if(pts.length<2){svg.innerHTML=`<line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="var(--line)" stroke-dasharray="4 4"/>`;$("curveEnd").textContent=""}
  else{
    const mn=Math.min(...pts),mx=Math.max(...pts),rng=(mx-mn)||1;
    const X=i=>i/(pts.length-1)*W, Y=v=>P+(1-(v-mn)/rng)*(H-2*P);
    const d=pts.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    const lastV=pts[pts.length-1];const c=lastV>=0?"var(--win)":"var(--loss)";
    svg.innerHTML=`<line x1="0" y1="${Y(0).toFixed(1)}" x2="${W}" y2="${Y(0).toFixed(1)}" stroke="var(--line)" stroke-dasharray="4 4"/><path d="${d} L${W} ${H} L0 ${H} Z" fill="${c}" opacity=".10"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    $("curveEnd").textContent=fmtR(Math.round(lastV*100)/100);
  }
  const m={};closed.forEach(t=>(t.setups||[]).forEach(s=>{m[s]=m[s]||{n:0,r:0};m[s].n++;m[s].r+=rOf(t)}));
  const arr=Object.entries(m).sort((a,b)=>b[1].r-a[1].r);
  $("setupStats").innerHTML=arr.length?arr.map(([k,v])=>`<span class="st" title="${v.n} işlem">${esc(k)} <b style="color:${v.r>=0?"var(--win)":"var(--loss)"}">${v.r>0?"+":""}${v.r.toFixed(1)}R</b> · ${v.n}</span>`).join(""):`<span class="hint">Setup bazında performans burada görünecek.</span>`;
}
function renderFilters(){
  const syms=[...new Set(trades.map(t=>(t.symbol||"").toUpperCase()).filter(Boolean))].sort();
  const sets=[...new Set(trades.flatMap(t=>t.setups||[]))];
  const chips=[{k:"all",v:null,l:"Tümü"},{k:"out",v:"win",l:"Kazanç"},{k:"out",v:"loss",l:"Kayıp"},{k:"out",v:"be",l:"Başa baş"},{k:"rules",v:null,l:"Kural dışı"}]
    .concat(syms.map(s=>({k:"sym",v:s,l:s}))).concat(sets.map(s=>({k:"setup",v:s,l:s})));
  $("filters").innerHTML=chips.map((c,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${filter.kind===c.k&&filter.value===c.v}">${esc(c.l)}</button>`).join("");
  $("filters").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const c=chips[+b.dataset.i];filter={kind:c.k,value:c.v};render()});
}
function renderList(list){
  const area=$("listArea");
  if(!trades.length){
    area.innerHTML=ownerKey?`<div class="empty"><h3>İlk işlemini kaydet</h3><p>Enstrüman, setup, giriş-stop-çıkış ve notlarını gir. R sonucu ve istatistikler otomatik hesaplanır.</p><button class="btn primary" type="button" id="emptyAdd">+ Yeni işlem</button></div>`
      :`<div class="empty"><h3>Henüz yayınlanmış işlem yok</h3><p>Kaydedilen işlemler burada tarih sırasıyla görünecek.</p></div>`;
    const b=$("emptyAdd");if(b)b.onclick=()=>openForm(null);return;
  }
  if(!list.length){area.innerHTML=`<div class="empty"><h3>Bu filtrede işlem yok</h3><p>Başka bir filtre seç ya da “Tümü”ne dön.</p></div>`;return}
  const groups={};list.forEach(t=>{const k=String(t.datetime||"").slice(0,10);(groups[k]=groups[k]||[]).push(t)});
  area.innerHTML=Object.entries(groups).map(([day,ts])=>{
    const dr=ts.reduce((s,t)=>s+(rOf(t)||0),0);
    return `<div class="daygroup"><div class="dayhead"><span>${esc(fmtDate(day))}</span><span class="num" style="color:${dr>0?"var(--win)":dr<0?"var(--loss)":"var(--muted)"}">${dr>0?"+":""}${dr.toFixed(2)}R</span></div><div class="list">`+
    ts.map(tradeCardHtml).join("")+`</div></div>`;
  }).join("");
  area.querySelectorAll(".trade").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
}

function localNow(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}

function shrinkImage(file){return new Promise((res,rej)=>{
  const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.85))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Görüntü açılamadı"))};img.src=u;})}

/* ---------- takvim ve istatistikler ---------- */
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DOWS=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
let calY=null,calM=null,calAuto=true,calUnit="R",statRange="month";
const dayKey=t=>String(t.datetime||"").slice(0,10);
const pad=n=>String(n).padStart(2,"0");
const keyOf=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function parseMoney(v){
  if(v==null)return null;let s=String(v).replace(/\s/g,"").replace("−","-");
  const m=s.match(/[-+]?\d[\d.,]*/);if(!m)return null;let x=m[0];
  const neg=/^-/.test(x)||/^-/.test(s);x=x.replace(/^[-+]/,"");
  const lc=x.lastIndexOf(","),ld=x.lastIndexOf(".");
  if(lc>-1&&ld>-1){x=lc>ld?x.replace(/\./g,"").replace(",","."):x.replace(/,/g,"")}
  else if(lc>-1){x=/,\d{3}$/.test(x)&&x.split(",").length>2?x.replace(/,/g,""):x.replace(",",".")}
  else if(ld>-1&&x.split(".").length>2){x=x.replace(/\./g,"")}
  const n=parseFloat(x);return isFinite(n)?(neg?-n:n):null;
}
const hasMoney=()=>!!ownerKey&&trades.some(t=>parseMoney(t.pnl)!=null);
function valOf(t){return calUnit==="$"?parseMoney(t.pnl):rOf(t)}
function fmtVal(v,short){if(v==null)return "—";if(calUnit==="$"){const a=Math.abs(v);const s=a>=10000&&short?(a/1000).toFixed(1)+"k":a.toLocaleString("tr-TR",{maximumFractionDigits:2});return (v>0?"+":v<0?"−":"")+s}return (v>0?"+":"")+v.toFixed(short?1:2)+"R"}
function dayMap(){const m={};trades.forEach(t=>{const k=dayKey(t);if(!k)return;(m[k]=m[k]||[]).push(t)});return m}
function sumVals(ts){let s=0,any=false;ts.forEach(t=>{const v=valOf(t);if(v!=null){s+=v;any=true}});return any?s:null}

function initCalMonth(){
  if(!calAuto&&calY!=null)return;
  const last=trades.map(dayKey).filter(Boolean).sort().pop();
  const d=last?new Date(last+"T12:00"):new Date();calY=d.getFullYear();calM=d.getMonth();
}
function renderCal(){
  if(!$("cal"))return;
  initCalMonth();
  $("unitSeg").hidden=!hasMoney();if(!hasMoney())calUnit="R";
  $("unitSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.u===calUnit));
  $("calTitle").textContent=`${MONTHS[calM]} ${calY}`;
  const map=dayMap();
  const first=new Date(calY,calM,1);const startDow=(first.getDay()+6)%7;
  const days=new Date(calY,calM+1,0).getDate();
  const now=new Date();const todayK=keyOf(now.getFullYear(),now.getMonth(),now.getDate());
  let html=DOWS.map(d=>`<div class="dow">${d}</div>`).join("")+`<div class="dow wkcol">Hafta</div>`;
  const totalCells=Math.ceil((startDow+days)/7)*7;
  let week=[];
  for(let i=0;i<totalCells;i++){
    const dn=i-startDow+1;
    if(dn<1||dn>days){html+=`<div class="cell out" aria-hidden="true"></div>`}
    else{
      const k=keyOf(calY,calM,dn);const ts=map[k]||[];const v=sumVals(ts);week.push(...ts);
      const cls=v==null?"":v>0.0001?"win":v<-0.0001?"loss":"";

        :`<div class="cell${k===todayK?" today":""}"><span class="d">${dn}</span></div>`;
    }
    if(i%7===6){const v=sumVals(week);const cls=v==null?"":v>0.0001?"win":v<-0.0001?"loss":"";
      html+=`<div class="cell wk wkcol ${week.length?cls:""}"><span class="d">Σ</span>${week.length?`<span class="r">${fmtVal(v,true)}</span><span class="n">${week.length} işlem</span>`:""}</div>`;week=[]}
  }
  $("cal").innerHTML=html;
  $("cal").querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>openDay(b.dataset.day));

function computeStats(ts){
  const closed=ts.filter(t=>valOf(t)!=null).sort((a,b)=>String(a.datetime).localeCompare(String(b.datetime)));
  const vals=closed.map(valOf);
  const wins=vals.filter(v=>v>0.0001),losses=vals.filter(v=>v<-0.0001);
  const sumW=wins.reduce((a,b)=>a+b,0),sumL=losses.reduce((a,b)=>a+b,0),tot=vals.reduce((a,b)=>a+b,0);
  let peak=0,acc=0,dd=0;vals.forEach(v=>{acc+=v;peak=Math.max(peak,acc);dd=Math.min(dd,acc-peak)});
  let ws=0,ls=0,cw=0,cl=0;vals.forEach(v=>{if(v>0.0001){cw++;cl=0}else if(v<-0.0001){cl++;cw=0}else{cw=0;cl=0}ws=Math.max(ws,cw);ls=Math.max(ls,cl)});
  const days={};closed.forEach(t=>{const k=dayKey(t);days[k]=(days[k]||0)+valOf(t)});
  const dv=Object.entries(days);const best=dv.slice().sort((a,b)=>b[1]-a[1])[0],worst=dv.slice().sort((a,b)=>a[1]-b[1])[0];
  const ruled=ts.filter(t=>t.rulesFollowed===true||t.rulesFollowed===false);
  const maxW=wins.length?Math.max(...wins):null,maxL=losses.length?Math.min(...losses):null;
  return {maxW,maxL,tdays:dv.length,n:ts.length,closed:closed.length,wins:wins.length,losses:losses.length,be:vals.length-wins.length-losses.length,
    wr:(wins.length+losses.length)?wins.length/(wins.length+losses.length):null,tot,avg:vals.length?tot/vals.length:null,
    avgW:wins.length?sumW/wins.length:null,avgL:losses.length?sumL/losses.length:null,
    pf:losses.length?sumW/Math.abs(sumL):(wins.length?Infinity:null),dd,ws,ls,
    winDays:dv.filter(d=>d[1]>0.0001).length,lossDays:dv.filter(d=>d[1]<-0.0001).length,best,worst,
    rules:ruled.length?ruled.filter(t=>t.rulesFollowed).length/ruled.length:null};
}

    box("Maks. düşüş",fmtVal(s.dd),"Zirveden en derin geri çekilme",s.dd<0?"color:var(--loss)":""),

const Music={

    const changed=m.mode!==this.cfg.mode||(m.url||"")!==this.cfg.url||(m.fileId||"")!==(this.cfg.fileId||"");

function fileToDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function loadLame(){return window.lamejs?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";sc.onload=()=>window.lamejs?res():rej(new Error("lamejs"));sc.onerror=rej;document.head.appendChild(sc)})}
async function toMp3(file,prog){
  prog("Ses ayıklanıyor…");
  const [_,buf]=await Promise.all([loadLame(),file.arrayBuffer()]);
  const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();
  let audio;try{audio=await ctx.decodeAudioData(buf)}catch(e){throw {msg:"Bu dosyanın sesi okunamadı. Farklı bir MP4/MP3 dene ya da Chrome kullan."}}finally{try{ctx.close()}catch(e){}}
  if(audio.duration>600)throw {msg:"Şarkı çok uzun. 10 dakikadan kısa bir şarkı seç."};
  const rate=audio.sampleRate,ch=Math.min(2,audio.numberOfChannels);
  const enc=new lamejs.Mp3Encoder(ch,rate,128);
  const toI16=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++){const v=Math.max(-1,Math.min(1,a[i]));o[i]=v<0?v*32768:v*32767}return o};
  const L=toI16(audio.getChannelData(0)),R=ch>1?toI16(audio.getChannelData(1)):null;
  const parts=[];const step=1152,n=L.length;let last=0;
  for(let i=0;i<n;i+=step){
    const out=R?enc.encodeBuffer(L.subarray(i,i+step),R.subarray(i,i+step)):enc.encodeBuffer(L.subarray(i,i+step));
    if(out.length)parts.push(new Uint8Array(out));
    if(Date.now()-last>120){last=Date.now();prog(`MP3'e çevriliyor… %${Math.round(i/n*100)}`);await new Promise(r=>setTimeout(r,0))}
  }
  const fl=enc.flush();if(fl.length)parts.push(new Uint8Array(fl));
  return new Blob(parts,{type:"audio/mpeg"});
}

/* ---------- başlat ---------- */
function showSetup(){
  $("journal").hidden=true;$("countSub").textContent="Kurulum bekleniyor";
  const a=$("setupArea");a.hidden=false;a.className="setup box";
  a.innerHTML=`<h2 style="margin-bottom:10px">Son adım: sunucu adresini ekle</h2><ol>
  <li>Google E-Tablolar'da yeni bir tablo aç, <code>Uzantılar → Apps Script</code>'e gir.</li>
  <li><code>Code.gs</code> dosyasının içeriğini yapıştır, en üstteki <code>SIFRE</code>'yi değiştir ve kaydet.</li>
  <li><code>kurulum</code> fonksiyonunu bir kez çalıştırıp izinleri onayla.</li>
  <li><code>Dağıt → Yeni dağıtım → Web uygulaması</code>: “Şu kullanıcı olarak yürüt: Ben”, “Erişimi olanlar: Herkes”.</li>
  <li>Verilen <code>…/exec</code> adresini <code>index.html</code> içindeki AYARLAR bölümünde <code>API_URL</code> satırına yapıştır.</li></ol>`;
}
if(SAHIP_ADI){$("title").textContent=SAHIP_ADI;document.title=SAHIP_ADI+" · Trade Günlüğü";$("footNote").textContent="Trade Günlüğü · Sonuçlar R (risk birimi) cinsindendir."}
$("addBtn").onclick=()=>openForm(null);
$("quickCap").onclick=async()=>{try{const d=await captureScreen();openForm(null,[d])}catch(e){const m=captureError(e);if(m)showNotice(m)}};
$("loginLink").onclick=openLogin;
$("themeLink").onclick=openTheme;
$("musicLink").onclick=openMusicSettings;
if(location.hash==="#gecmis"||location.hash==="#takvim")setTab("gecmis");
$("logout").onclick=logout;
if(!API_URL){showSetup();return}
const k=lsGet(KEY_LS);if(k)setOwner(k);
if(!k){try{const c=JSON.parse(lsGet(CACHE_LS)||"null");if(Array.isArray(c)&&c.length){trades=c;render()}}catch(e){}}
load();
})();
</script>
</body>
</html>
