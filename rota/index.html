<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rota — Günlük Plan ve Hedefler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;--card:#171a21;--card2:#1e222b;--text:#eef0f4;--muted:#8b93a3;--line:#2a2f3a;
  --accent:#e8b84a;--accentText:#1a1405;--fs:16px;
  --spor:#ef6b5b;--kitap:#a77bf3;--ingilizce:#4aa3f0;--diksiyon:#f0a04a;--trade:#e8c95a;--ders:#4cc38a;--defter:#2dd4bf;--diger:#94a3b8;--dinlenme:#6b7280;
  --up:#22c55e;--down:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:84px;transition:background .3s,color .3s}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;font-weight:700;margin:22px 0 10px}
h3{font-size:.95rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.chip .d{display:block;font-size:.68rem;opacity:.75;font-weight:500}
.chip .dot{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--defter)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.82rem;font-weight:700;padding:8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text)}
.ring{position:relative;width:74px;height:74px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem}
.tools{display:flex;gap:8px;margin-top:10px}
.tools .btn{flex:1}
.quoteCard{border-left:4px solid var(--accent);background:var(--card);border-radius:14px;padding:12px 14px;margin-top:14px}
.quoteCard p{font-weight:700;font-size:.95rem;line-height:1.45}
.quoteCard span{font-size:.75rem;color:var(--muted)}
.defterCard{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--defter) 12%,var(--card));border:1px solid color-mix(in srgb,var(--defter) 35%,var(--line));border-radius:14px;padding:12px 14px;margin-top:8px}
.defterCard .q{flex:1;font-size:.84rem;line-height:1.4}
.defterCard b{display:block;font-size:.9rem;margin-bottom:2px}
.blk{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:7px;border-left:4px solid var(--c);transition:opacity .2s}
.blk.rest{opacity:.62}
.blk.now{box-shadow:0 0 0 2px var(--accent)}
.blk.done .tt{text-decoration:line-through;opacity:.6}
.blk .tm{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px;padding-top:2px}
.blk .bd{flex:1;cursor:pointer;min-width:0}
.blk .tt{font-weight:700;font-size:.93rem}
.blk .ds{font-size:.8rem;color:var(--muted);margin-top:4px;display:none;line-height:1.45}
.blk.open .ds{display:block}
.tag{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);margin-top:4px}
.cb{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--accentText)}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb svg{width:15px;height:15px}
.nowtag{font-size:.65rem;background:var(--accent);color:var(--accentText);padding:2px 6px;border-radius:5px;margin-left:6px;font-weight:800;vertical-align:middle}
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.64rem;font-weight:700;padding:6px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--accent)}
nav svg{width:21px;height:21px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.goal .stp{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:.86rem;cursor:pointer}
.goal .stp .cb{width:20px;height:20px;border-radius:6px}
.goal .stp .cb svg{width:12px;height:12px}
.goal .stp.d span:last-child{text-decoration:line-through;color:var(--muted)}
.why{font-size:.78rem;color:var(--muted);margin:3px 0 8px;line-height:1.4}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:0 4px;font-family:inherit;font-weight:700}
.row{display:flex;gap:6px;margin-top:8px}
input[type=text],select,input[type=time]{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:.85rem;min-width:0}
input[type=text]{flex:1}
.btn{border:0;background:var(--accent);color:var(--accentText);font:inherit;font-weight:700;font-size:.85rem;border-radius:10px;padding:9px 13px;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--down);border:1px solid color-mix(in srgb,var(--down) 40%,var(--line))}
.btn:disabled{opacity:.5}
.hz{display:flex;align-items:center;gap:8px;margin:24px 0 10px}
.hz .n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accentText);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.ladder{counter-reset:l}
.ladder li{list-style:none;position:relative;padding:8px 0 8px 34px;font-size:.86rem;border-bottom:1px dashed var(--line)}
.ladder li:last-child{border:0}
.ladder li::before{counter-increment:l;content:counter(l);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:7px;background:var(--card2);color:var(--accent);font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-size:1.4rem;display:block}
.catrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.84rem}
.catrow .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.catrow .bar{flex:1}
.catrow .bar i{background:var(--c)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.th{border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;font:inherit;font-size:.8rem;font-weight:700;text-align:left}
.th.on{border-color:var(--accent)}
.th .sw{display:flex;gap:4px;margin-bottom:8px}
.th .sw i{width:16px;height:16px;border-radius:5px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.colors button{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--text)}
.guide p,.guide li{font-size:.86rem;line-height:1.55}
.guide ul{padding-left:18px;margin-top:6px}
.guide li{margin:4px 0}
.mq{padding:10px 0;border-bottom:1px dashed var(--line)}
.mq:last-child{border:0}
.mq p{font-weight:600;font-size:.88rem}
.mq span{font-size:.72rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:44px;height:34px;border:0;background:none;cursor:pointer}
/* pano */
.pbox{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.pbox .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(34,197,94,.26);transition:width 2s steps(14,end);z-index:0}
.pbox>*:not(.fill){position:relative;z-index:1}
.pbox.full{border-color:rgba(34,197,94,.55)}
.pbox ul{margin-top:8px;padding-left:0;list-style:none}
.pbox li{font-size:.84rem;padding:3px 0;display:flex;gap:8px}
.pbox li .m{flex:0 0 14px;color:var(--muted)}
.pbox li.d .m{color:var(--up)}
.pbox .pc{font-size:.78rem;font-weight:800;color:var(--muted)}
.pbox.full .pc{color:var(--up)}
/* calendar */
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:12px}
.calin{display:flex;min-width:max-content}
.calt{width:38px;flex:0 0 38px;position:relative;border-right:1px solid var(--line)}
.calcol{width:96px;flex:0 0 96px;position:relative;border-right:1px solid var(--line)}
.calcol:last-child{border-right:0}
.calh{height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;border-bottom:1px solid var(--line);cursor:pointer}
.calh.today{color:var(--accent)}
.calbody{position:relative}
.calline{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.calt span{position:absolute;right:4px;font-size:.6rem;color:var(--muted);transform:translateY(-50%)}
.cev{position:absolute;left:3px;right:3px;border-radius:6px;padding:2px 4px;font-size:.6rem;font-weight:700;line-height:1.2;overflow:hidden;background:color-mix(in srgb,var(--c) 28%,var(--card));border-left:3px solid var(--c);cursor:pointer}
.cev.done{opacity:.45}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.ecard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px;margin-bottom:8px}
.ecard .tr{display:flex;gap:6px;align-items:center}
.ecard input[type=time]{flex:1;padding:7px 8px}
.ecard .tr2{display:flex;gap:6px;margin-top:6px}
.ecard select{flex:0 0 120px}
.book{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.book:last-child{border:0}
.book .n{width:22px;font-size:.72rem;color:var(--muted);font-weight:700;text-align:right}
.book .t{flex:1}
.book .t b{font-size:.88rem;display:block}
.book .t span{font-size:.72rem;color:var(--muted)}
.book.d .t b{text-decoration:line-through;color:var(--muted)}
.cur{font-size:.62rem;font-weight:800;background:var(--kitap);color:#fff;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.tick{font-size:9px;fill:var(--muted);font-family:Manrope,sans-serif}
.sync{font-size:.7rem;color:var(--muted);text-align:center;margin-top:18px}

/* ===== desktop (yatay) mode ===== */
.topbar{display:flex;justify-content:flex-end;margin:-8px 0 6px}
.desk .topbar{display:none}
.deskonly{display:none}
.desk .deskonly{display:block}
.desk .colB .tag{display:none}
.desk .colB .tag.keep{display:inline-block}
.desk .colB .blk.rest{padding:5px 12px}
.wk{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.8rem;cursor:pointer}
.wk.on b{color:var(--accent)}
.wk .bar{flex:1;height:6px}
.modebtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 10px;font:inherit;font-size:.72rem;font-weight:700;cursor:pointer}
.brand,.navfoot{display:none}
body.desk{padding-bottom:0}
.desk nav{top:0;bottom:0;left:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:20px 12px;background:var(--card)}
.desk nav .in{flex-direction:column;gap:2px;max-width:none;height:100%}
.desk nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:.88rem;padding:10px 12px;border-radius:10px}
.desk nav button.on{background:var(--card2)}
.desk nav svg{width:19px;height:19px}
.desk .brand{display:block;font-weight:800;font-size:1.25rem;padding:0 12px 16px;letter-spacing:-.02em}
.desk .brand span{color:var(--accent)}
.desk .navfoot{display:block;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.desk .navfoot .muted{display:block;font-size:.68rem;padding:8px 12px 0}
.desk .wrap{max-width:none;margin:0 0 0 200px;padding:22px 26px 10px}
.desk .sync{margin-top:8px}
.desk .dgrid{display:grid;grid-template-columns:minmax(270px,310px) minmax(380px,1fr) minmax(300px,380px);gap:20px;align-items:start}
.desk .dgrid>div{max-height:calc(100vh - 60px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.desk .colA{order:1}.desk .colB{order:2}.desk .colC{order:3}
.desk .colC .quoteCard:first-child,.desk .colC>.card:first-child{margin-top:0}
.desk .colB .blk{margin-bottom:5px;padding:8px 12px}
.desk .chips{flex-wrap:wrap;overflow:visible}
.desk .hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start;margin-top:8px}
.desk .hgrid .hz{margin-top:6px}
.desk .hgrid>.hcol>h2{margin-top:6px}
.desk .tgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:12px}
.desk .tgrid .card:first-child{margin-top:0!important}
.desk .cols{columns:2 360px;column-gap:22px;margin-top:6px}
.desk .cols>.gsec{break-inside:avoid;display:inline-block;width:100%}
.desk .cols>.gsec>h2:first-child{margin-top:10px}
.desk .calin{min-width:100%}
.desk .calcol{flex:1 1 0;min-width:110px}
.desk .ov{align-items:center}
.desk .sheet{border-radius:20px;max-width:640px;max-height:86vh}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div id="modal"></div>

<script>
// ================= DATA =================
const CATS={spor:'Spor',kitap:'Kitap',ingilizce:'İngilizce',diksiyon:'Diksiyon',trade:'Trade',ders:'Ders',defter:'Defter',diger:'Diğer',dinlenme:'Dinlenme'};
const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const DSH=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const B=(s,e,t,c,d='',id)=>({id:id||(s+'|'+c),s,e,t,c,d});
const F=(b,flex)=>(b.flex=flex,b);
const RULES="Kural: 1R = 125$, günlük en fazla -250$, hedef 3R, 2R'de yarısını kapat ve stopu girişe çek. Setup yoksa işlem yok.";

function defWeekday(sport){
  const a=[B('06:00','06:15','Uyan ve hedeflerine bak','dinlenme','Su iç, yatağını topla, Pano sekmesine 1 dakika bak.')];
  if(sport) a.push(
    B('06:15','06:30','Spora yol','dinlenme','15 dk. Yolda İngilizce bir podcast açabilirsin.'),
    B('06:30','07:30','Spor','spor','Fizik hedefi üç şeyle gelir: düzenli antrenman, protein ağırlıklı beslenme, 8 saat uyku.'),
    B('07:30','07:45','Dönüş','dinlenme'),
    B('07:45','08:15','Duş ve kahvaltı','dinlenme'),
    B('08:15','09:00','Kitap','kitap','Günde 20–30 sayfa. Kitaptan uygulayacağın 1 cümleyi deftere not al.'));
  else a.push(
    B('06:15','06:45','Tempolu yürüyüş','spor','Spor günü değil ama hareket var: 30 dk yürüyüş ve sabah güneşi.'),
    B('06:45','07:15','Duş ve kahvaltı','dinlenme'),
    B('07:15','08:15','Kitap (uzun seans)','kitap','Spor olmayan günlerde okumaya daha çok zaman.'),
    B('08:15','09:00','Serbest zaman','dinlenme'));
  a.push(
    B('09:00','10:30','Trade çalışma','trade','Mentorluk notlarını tekrar et, backtest yap, modelini geliştir.'),
    B('10:30','11:00','Mola','dinlenme'),
    B('11:00','13:00','Ders: 1. blok','ders','En zor dersin, yeni konu. 50 dk çalış, 10 dk mola.'),
    B('13:00','13:45','Öğle yemeği ve mola','dinlenme','Ekransız.'),
    F(B('13:45','15:15','Esnek zaman (hafif tekrar ya da serbest)','dinlenme','Sınav dönemi modunda bu blok tam ders bloğuna dönüşür.'),'Ders: 2. blok'),
    B('15:15','15:45','Dinlenme ya da kısa uyku','dinlenme',"17:00'ye kafan taze girsin."),
    B('15:45','16:50','Piyasa hazırlığı','trade','HTF bias, haber takvimi, kilit seviyeler ve çeyrek seviyeleri.'),
    B('17:00','18:30','İşlem penceresi','trade',RULES),
    B('18:30','19:00','Trade journal','trade',"İşlemlerini journal'ına gir: ekran görüntüsü, R sonucu, kurallara uyum."),
    B('19:00','19:45','Akşam yemeği','dinlenme'),
    B('19:45','20:45','İngilizce','ingilizce','20 dk kelime (Anki), 20 dk dinleme, 20 dk konuşma ya da yazma. Shadowing ile diksiyona da katkı.'),
    B('20:45','21:05','Diksiyon','diksiyon','Bağırmadan: nefes, kalem tekniği, fısıltılı tekerleme. Ayrıntılar Rehber sekmesinde.'),
    B('21:05','21:20','Defter: günün düşünceleri','defter','Bugün ne hissettim? Ne öğrendim? Kendime tavsiyem ne? Yazınca işaretle.','defter'),
    B('21:30','22:00','Ekranı kapat, yarını hazırla','dinlenme','22:00 uyku, 06:00 kalkış: 8 saat. Kas ve odak uykuda toparlanır.'));
  return a;
}
function defSaturday(){return[
  B('06:00','06:15','Uyan ve hedeflerine bak','dinlenme'),
  B('06:15','06:30','Spora yol','dinlenme'),
  B('06:30','07:30','Spor','spor','Haftanın son antrenmanı.'),
  B('07:30','07:45','Dönüş','dinlenme'),
  B('07:45','08:15','Duş ve kahvaltı','dinlenme'),
  B('08:15','09:00','Kitap','kitap'),
  B('10:00','12:00','Haftalık trade review ve backtest','trade','Kurala uyum yüzdesi, ortalama R, en büyük hata. Gelecek haftaya tek bir düzeltme seç.'),
  B('12:00','13:00','Öğle yemeği','dinlenme'),
  B('13:00','15:00','Ders','ders','Haftanın tekrarı.'),
  F(B('15:00','16:30','Serbest zaman','dinlenme','Sınav dönemi modunda ders bloğu olur.'),'Ders: ek blok'),
  B('16:30','17:30','İngilizce: haftalık tekrar','ingilizce','Haftanın kelimeleri ve 5 dk konuşma kaydı.'),
  B('17:30','17:50','Diksiyon: haftalık kayıt','diksiyon','Aynı paragrafı oku ve kaydet; geçen haftakiyle karşılaştır.'),
  B('18:00','21:00','Sosyal zaman','dinlenme','Arkadaşlar ya da aile. Enerji için bu da plana dahil.'),
  B('21:15','21:30','Defter: günün düşünceleri','defter','Bu hafta neyi iyi yaptım? Neyi değiştireceğim?','defter'),
  B('22:00','22:30','Uyku','dinlenme')];}
function defSunday(){return[
  B('06:00','06:30','Yavaş başla','dinlenme','Spor yok. İstersen hafif bir yürüyüş.'),

function baseFor(d){const k=key(d);return st.ovr[k]||st.tpl[d.getDay()]||defaultFor(d.getDay())}

  const ids=schedule(d).filter(b=>b.c!=='dinlenme').map(b=>b.id).concat((PLAN[k]||[]).map(p=>'p:'+p.id));

 document.getElementById('app').innerHTML=(ui.mode==='desk'?'':'<div class="topbar"><button class="modebtn" data-act="mode">🖥 Masaüstü modu</button></div>')+v()+`<p class="sync">${syncText()}</p>`;
 document.getElementById('nav').innerHTML=TABS.map(([k,n,ic])=>`<button class="${ui.tab===k?'on':''}" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${n}</button>`).join('');
 if(ui.mode==='desk'){const nv=document.getElementById('nav');nv.insertAdjacentHTML('afterbegin','<div class="brand">Rota<span>.</span></div>');
  nv.insertAdjacentHTML('beforeend','<div class="navfoot"><button data-act="mode" style="width:100%">📱 Telefon modu</button><span class="muted">'+new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})+'</span></div>')}
 groupCols();
 if(ui.tab==='pano'){const fs=document.querySelectorAll('.fill');
  if(lastTab!=='pano'){requestAnimationFrame(()=>setTimeout(()=>fs.forEach(f=>f.style.width=f.dataset.p+'%'),120))}
  else fs.forEach(f=>{f.style.transition='none';f.style.width=f.dataset.p+'%'})}
 lastTab=ui.tab;
}
function groupCols(){document.querySelectorAll('.cols').forEach(c=>{let cur=null;[...c.children].forEach(ch=>{
  if(ch.tagName==='H2'||!cur){cur=document.createElement('div');cur.className='gsec';c.insertBefore(cur,ch)}cur.appendChild(ch)})})}
function arm(id){ui.pending=id;render();setTimeout(()=>{if(ui.pending===id){ui.pending=null;render()}},3000)}

document.addEventListener('click',e=>{
 const el=e.target.closest('button,[data-open],[data-stp],[data-book],[data-goday],[data-day],[data-act]');if(!el)return;const d=el.dataset;
 if(d.act==='ovclose'){if(e.target===el){ui.modal=null;renderModal()}return}
 if(d.tab){ui.tab=d.tab;ui.cal=false;LS.set('tab',ui.tab);render();scrollTo(0,0);return}
 if(d.wk!==undefined){const v=+d.wk;ui.wk=v===0?0:ui.wk+v;const t=today();if(ui.wk===0)ui.sel=null;else{const wd=weekDates(ui.wk);ui.sel=wd[0]}render();return}
 if(d.day){ui.sel=fromKey(d.day);render();return}
 if(d.goday){ui.sel=fromKey(d.goday);ui.cal=false;render();scrollTo(0,0);return}
 if(d.exam){st.exam=d.exam==='1';save();render();return}
 if(d.open){ui.open[d.open]=!ui.open[d.open];render();return}
 if(d.chk){toggleCheck(d.k,d.chk);render();return}
 if(d.stp){const g=st.goals.find(x=>x.id===d.stp);g.steps[+d.j].d=!g.steps[+d.j].d;save();render();return}
 if(d.book){st.books[d.book]?delete st.books[d.book]:st.books[d.book]=Date.now();save();renderModal();render();return}
 if(d.delg){if(ui.pending!==d.delg)return arm(d.delg);st.goals=st.goals.filter(x=>x.id!==d.delg);ui.pending=null;save();render();return}
 if(d.addstep){const inp=document.querySelector(`[data-stepin="${d.addstep}"]`);const v=inp.value.trim();if(!v)return;
  st.goals.find(x=>x.id===d.addstep).steps.push({t:v,d:false});save();render();return}
 if(d.addgoal){const inp=document.querySelector(`[data-goalin="${d.addgoal}"]`);const v=inp.value.trim();if(!v)return;
  const g=G(d.addgoal,v,'',[]);st.goals.push(g);save();genSteps(g);return}
 if(d.theme){st.theme.k=d.theme;st.theme.accent=null;save();render();return}
 if(d.acc){st.theme.accent=d.acc;save();render();return}
 if(d.reset){if(ui.pending!==d.reset)return arm(d.reset);
  if(d.reset==='g')st.goals=defaultGoals();if(d.reset==='c')st.checks={};if(d.reset==='p'){st.tpl={};st.ovr={}}
  ui.pending=null;save();render();return}
 if(d.scope){ui.draft.scope=d.scope;renderModal();return}
 if(d.start){const dd=fromKey(ui.draft.k);
  ui.draft.rows=d.start==='cur'?baseFor(dd).map(b=>({...b})).sort((a,b)=>toMin(a.s)-toMin(b.s))
   :[...Array(16)].map((_,i)=>({id:null,s:fmt((6+i)*60),e:fmt((7+i)*60),t:'',c:'diger'}));renderModal();return}
 if(d.delrow){ui.draft.rows.splice(+d.delrow,1);renderModal();return}
 switch(d.act){
  case 'cal':ui.cal=!ui.cal;render();scrollTo(0,0);break;
  case 'edit':openEdit();break;
  case 'books':ui.modal='books';renderModal();break;
  case 'close':ui.modal=null;ui.draft=null;renderModal();break;
  case 'addrow':{const rs=ui.draft.rows,last=rs.length?toMin(rs[rs.length-1].e):6*60;rs.push({id:null,s:fmt(last),e:fmt(Math.min(last+60,23*60+59)),t:'',c:'diger'});renderModal();
   const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=sh.scrollHeight;break}
  case 'saveedit':saveEdit();break;
  case 'clearovr':delete st.ovr[ui.draft.k];save();ui.modal=null;renderModal();render();break;
  case 'cleartpl':delete st.tpl[fromKey(ui.draft.k).getDay()];delete st.ovr[ui.draft.k];save();ui.modal=null;renderModal();render();break;
  case 'mode':ui.mode=ui.mode==='desk'?'mobile':'desk';LS.set('mode',ui.mode);render();scrollTo(0,0);break;
  case 'sconnect':SURL=document.getElementById('surl').value.trim();STOK=document.getElementById('stok').value.trim();LS.set('surl',SURL);LS.set('stok',STOK);ui.sync='yerel';el.textContent='Bağlanıyor…';sheetsLoad();break;
  case 'sdisconnect':SURL='';STOK='';LS.set('surl','');LS.set('stok','');ui.sync='yerel';render();break;
  case 'accreset':st.theme.accent=null;save();render();break;
  case 'export':{const txt=JSON.stringify(persist());
   const fb=()=>{const b=document.getElementById('impbox');if(b){b.value=txt;b.select()}el.textContent='Aşağıdaki kutudan kopyala'};
   try{navigator.clipboard.writeText(txt).then(()=>{el.textContent='Kopyalandı ✓'},fb)}catch(err){fb()}break}
  case 'import':{const b=document.getElementById('impbox');try{const r=JSON.parse(b.value);if(!Array.isArray(r.goals))throw 0;
   PKEYS.forEach(k=>{if(r[k]!==undefined)st[k]=r[k]});save();render();const nb=document.querySelector('[data-act="import"]');if(nb)nb.textContent='İçe aktarıldı ✓'}
   catch(err){el.textContent='Veri okunamadı, tekrar dene'}break}
 }
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
 if(t.dataset.stepin)document.querySelector(`[data-addstep="${t.dataset.stepin}"]`).click();
 if(t.dataset.goalin)document.querySelector(`[data-addgoal="${t.dataset.goalin}"]`).click()});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.f&&ui.draft){const r=ui.draft.rows[+t.dataset.i];r[t.dataset.f]=t.value;
  if(t.dataset.f==='t'||t.dataset.f==='c')delete r.flex;
  if(t.dataset.f==='c')t.closest('.ecard').style.setProperty('--c',`var(--${t.value})`);return}
 if(t.id==='fs'){st.theme.fs=+t.value;save();applyTheme();const p=t.nextElementSibling;if(p)p.textContent='Aa — '+st.theme.fs+'px'}
 if(t.id==='accpick'){st.theme.accent=t.value;save();applyTheme()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f==='c'&&ui.draft){ui.draft.rows[+t.dataset.i].c=t.value;delete ui.draft.rows[+t.dataset.i].flex}
 if(t.id==='accpick')render()});
render();
setInterval(()=>{if(ui.tab==='bugun'&&!ui.modal&&!document.querySelector('input:focus'))render()},60000);
</script>
</body>
</html>
